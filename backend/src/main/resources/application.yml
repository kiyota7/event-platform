server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:eventdb;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: 1440
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  mail:
    # 未設定ならログ出力のみ(開発用)。本番はSENDGRID_API_KEYを設定
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from: ${MAIL_FROM:noreply@example.com}
  reminder:
    hours-before: 24
    interval-ms: 600000
management:
  endpoints:
    web:
      exposure:
        include: health
